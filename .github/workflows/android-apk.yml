name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]
    paths:
      - "app/**"
      - "engine/**"
      - "build.gradle"
      - "build.gradle.kts"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "app/**"
      - "engine/**"
      - "build.gradle"
      - "build.gradle.kts"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and validate Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK and native toolchain
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK and CMake
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools vulkan-tools vulkan-validationlayers
      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/native_engine.cpp
          command -v glslangValidator
          command -v spirv-val
          command -v vulkaninfo
          test -d /usr/share/vulkan/explicit_layer.d || test -d /usr/share/vulkan/implicit_layer.d
      - name: Build Android debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Run unit tests
        run: gradle --no-daemon --stacktrace test
      - name: Validate and locate APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find . -type f -path '*/build/outputs/apk/*/*.apk' -not -path '*/build/intermediates/*' | sort)
          if (( ${#apks[@]} == 0 )); then echo "::error::No APK found after assembleDebug."; exit 1; fi
          mkdir -p validated-apk
          for apk in "${apks[@]}"; do test -s "$apk"; cp "$apk" "validated-apk/$(basename "$(dirname "$apk")")-$(basename "$apk")"; done
          ls -lh validated-apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neo-3d-android-apk
          path: validated-apk/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neo-3d-android-build-diagnostics
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
